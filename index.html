  <style>
    /* ── Light tokens ─────────────────────────────────────────────── */
    :root {
      --bgTop: #f2f3f7;
      --bgBot: #ffffff;
      --card: rgba(255,255,255,.76);
      --stroke: rgba(10,10,12,.09);
      --text: rgba(10,10,12,.92);
      --muted: rgba(10,10,12,.50);
      --btn: rgba(10,10,12,.042);
      --btnHover: rgba(10,10,12,.068);
      --btnPressed: rgba(10,10,12,.095);
      --btnPrimary: rgba(0,120,255,1);
      --btnPrimaryText: #fff;
      --shadow: 0 32px 90px rgba(10,10,12,.13);
      --shadowBtn: 0 2px 8px rgba(10,10,12,.07);
      --radius: 34px;
      --radiusBtn: 16px;
      --ease: cubic-bezier(0.22,1,0.36,1);
      --icon: rgba(10,10,12,.60);
    }

    /* ── Dark tokens ──────────────────────────────────────────────── */
    @media (prefers-color-scheme: dark) {
      :root {
        --bgTop: #0b0f19;
        --bgBot: #111520;
        --card: rgba(255,255,255,.065);
        --stroke: rgba(255,255,255,.10);
        --text: rgba(255,255,255,.92);
        --muted: rgba(255,255,255,.46);
        --btn: rgba(255,255,255,.07);
        --btnHover: rgba(255,255,255,.11);
        --btnPressed: rgba(255,255,255,.15);
        --shadow: 0 32px 90px rgba(0,0,0,.45);
        --shadowBtn: 0 2px 8px rgba(0,0,0,.25);
        --icon: rgba(255,255,255,.55);
      }
    }

    /* ── Reset & base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;         /* ← centrado vertical */
      justify-content: center;

      padding:
        calc(10px + env(safe-area-inset-top))
        calc(20px + env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        calc(20px + env(safe-area-inset-left));

      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", system-ui, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;

      background:
        radial-gradient(900px 600px at 18% 12%,  rgba(0,122,255,.18),   transparent 55%),
        radial-gradient(750px 520px at 86% 22%,  rgba(175,82,222,.14),  transparent 60%),
        radial-gradient(700px 500px at 60% 90%,  rgba(52,199,89,.09),   transparent 55%),
        linear-gradient(180deg, var(--bgTop), var(--bgBot));
    }

    /* ── Card ─────────────────────────────────────────────────────── */
    .card-wrapper { perspective: 900px; }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 40px 28px 36px;
      text-align: center;

      border: 0.5px solid var(--stroke);
      box-shadow: var(--shadow);

      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);

      position: relative;
      overflow: hidden;

      opacity: 0;
      transform: translateY(10px) scale(.99);
      animation: cardEnter .5s var(--ease) forwards;
    }

    /* Glass gloss — simula la luz en borde superior */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        158deg,
        rgba(255,255,255,.22) 0%,
        rgba(255,255,255,.04) 40%,
        transparent 60%
      );
      pointer-events: none;
      z-index: 0;
    }

    @keyframes cardEnter {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .tilt {
      will-change: transform;
      transform-style: preserve-3d;
      transition: transform .08s linear;
      position: relative;
      z-index: 1;
    }

    /* ── Staggered children ───────────────────────────────────────── */
    .avatar, h1, .role, .primary-btn, .links, footer {
      opacity: 0;
      transform: translateY(10px);
      animation: itemEnter .45s var(--ease) forwards;
    }
    .avatar      { animation-delay: .08s; }
    h1           { animation-delay: .13s; }
    .role        { animation-delay: .17s; }
    .primary-btn { animation-delay: .21s; }
    .links       { animation-delay: .25s; }
    footer       { animation-delay: .29s; }

    @keyframes itemEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Avatar ───────────────────────────────────────────────────── */
    .avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      border-radius: 50%;           /* ← círculo, más personal */
      overflow: hidden;
      box-shadow:
        0 0 0 3px var(--card),
        0 0 0 4px var(--stroke),
        0 14px 36px rgba(0,0,0,.12);
      background: rgba(120,120,128,.18);
    }

    .avatar img {
      width: 100%; height: 100%; object-fit: cover;
      /* fallback visual si no carga la imagen */
    }

    /* ── Text ─────────────────────────────────────────────────────── */
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;            /* ← más presencia */
      letter-spacing: -.04em;
    }

    .role {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: -.01em;
    }

    /* ── Primary CTA (Web) ────────────────────────────────────────── */
    .primary-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      padding: 14px 20px;
      border-radius: var(--radiusBtn);
      border: none;
      background: var(--btnPrimary);
      color: var(--btnPrimaryText);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.02em;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,120,255,.35);
      transition: .12s var(--ease);
    }

    .primary-btn:hover  { transform: translateY(-1px); filter: brightness(1.08); }
    .primary-btn:active { transform: scale(.982); filter: brightness(.95); }

    .primary-btn:focus-visible {
      outline: 3px solid rgba(0,120,255,.45);
      outline-offset: 3px;
    }

    /* ── Grid de links ────────────────────────────────────────────── */
    .links {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 10px;
      border-radius: var(--radiusBtn);
      border: 0.5px solid var(--stroke);
      background: var(--btn);
      box-shadow: var(--shadowBtn);
      text-decoration: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -.015em;
      transition: .12s var(--ease);
    }

    .btn:hover  { background: var(--btnHover); transform: translateY(-1px); }
    .btn:active { background: var(--btnPressed); transform: scale(.982); filter: brightness(.97); }

    .btn:focus-visible {
      outline: 2px solid rgba(0,120,255,.55);
      outline-offset: 2px;
    }

    .btn svg, .primary-btn svg {
      flex-shrink: 0;
      opacity: .8;
    }

    /* ── Footer ───────────────────────────────────────────────────── */
    footer {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .01em;
    }
  </style>

</head>
